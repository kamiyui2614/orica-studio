<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Duel Masters オリジナルカード作成・管理ツール ORICA STUDIO">
    <title>ORICA STUDIO</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <h1>ORICA STUDIO</h1>
        <nav class="main-nav" aria-label="メインメニュー">
            <button id="createTabButton" class="nav-button active" type="button">カード作成</button>
            <button id="listTabButton" class="nav-button" type="button">カード一覧</button>
            <a class="nav-button report-button" href="https://forms.gle/" target="_blank" rel="noopener">🛠 不具合を報告</a>
        </nav>
    </div>
</header>

<main class="page-container">

    <!-- =========================
         カード作成
    ========================== -->
    <section id="createSection" class="section-card">
        <div class="section-heading">
            <div>
                <p class="eyebrow">CREATE</p>
                <h2>カード作成</h2>
            </div>
        </div>

        <div class="mode-buttons">
            <button id="twinpactButton" class="mode-button" type="button">ツインパクト</button>
            <button id="dragHeartButton" class="mode-button" type="button">ドラグハート</button>
            <button id="psychicButton" class="mode-button" type="button">サイキック</button>
        </div>

        <!-- 通常カード入力 -->
        <div id="normalCardFields">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="cardName">名前</label>
                    <input id="cardName" type="text" placeholder="カード名">
                </div>

                <div class="form-group">
                    <label for="reading">読み方</label>
                    <input id="reading" type="text" placeholder="よみかた">
                </div>

                <div class="form-group">
                    <label>文明</label>
                    <div id="civilizationButtons" class="civilization-buttons">
                        <button type="button" class="civilization-button" data-civilization="光">光</button>
                        <button type="button" class="civilization-button" data-civilization="水">水</button>
                        <button type="button" class="civilization-button" data-civilization="闇">闇</button>
                        <button type="button" class="civilization-button" data-civilization="火">火</button>
                        <button type="button" class="civilization-button" data-civilization="自然">自然</button>
                        <button type="button" class="civilization-button" data-civilization="無色">無色</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cost">コスト</label>
                    <input id="cost" type="text" inputmode="numeric" placeholder="5">
                </div>

                <div class="form-group">
                    <label for="power">パワー</label>
                    <input id="power" type="text" placeholder="5000">
                </div>

                <div class="form-group">
                    <label for="race">種族</label>
                    <div class="input-with-button">
                        <input id="race" type="text" placeholder="種族">
                        <button id="raceSlashButton" type="button" class="small-button">/</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cardType">カードタイプ</label>
                    <input id="cardType" type="text" placeholder="クリーチャー / 呪文 など">
                </div>
            </div>

            <div id="normalAbilityField" class="form-group ability-group">
                <label for="ability">能力</label>
                <textarea id="ability" rows="8" placeholder="■能力を入力"></textarea>
            </div>
        </div>

        <!-- ツインパクト下面 -->
        <div id="twinpactPanel" class="sub-panel hidden">
            <div class="sub-panel-heading">
                <h3>ツインパクト下面</h3>
            </div>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="bottomCardName">名前</label>
                    <input id="bottomCardName" type="text" placeholder="下面のカード名">
                </div>

                <div class="form-group">
                    <label for="bottomReading">読み方</label>
                    <input id="bottomReading" type="text" placeholder="よみかた">
                </div>

                <div class="form-group">
                    <label>文明</label>
                    <div id="bottomCivilizationButtons" class="civilization-buttons">
                        <button type="button" class="civilization-button" data-civilization="光">光</button>
                        <button type="button" class="civilization-button" data-civilization="水">水</button>
                        <button type="button" class="civilization-button" data-civilization="闇">闇</button>
                        <button type="button" class="civilization-button" data-civilization="火">火</button>
                        <button type="button" class="civilization-button" data-civilization="自然">自然</button>
                        <button type="button" class="civilization-button" data-civilization="無色">無色</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bottomCost">コスト</label>
                    <input id="bottomCost" type="text" inputmode="numeric" placeholder="5">
                </div>

                <div class="form-group">
                    <label for="bottomRace">種族</label>
                    <div class="input-with-button">
                        <input id="bottomRace" type="text" placeholder="種族 / 呪文なら空欄でも可">
                        <button id="bottomRaceSlashButton" type="button" class="small-button">/</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bottomCardType">カードタイプ</label>
                    <input id="bottomCardType" type="text" value="呪文">
                </div>
            </div>

            <div class="form-group ability-group">
                <label for="bottomAbility">能力</label>
                <textarea id="bottomAbility" rows="8" placeholder="■能力を入力"></textarea>
            </div>
        </div>

        <!-- 特殊カードモード -->
        <div id="multiFaceModePanel" class="sub-panel hidden">
            <div class="sub-panel-heading">
                <h3>特殊カードの面数</h3>
            </div>
            <div class="mode-buttons compact">
                <button id="doubleFaceButton" class="mode-button" type="button">両面</button>
                <button id="tripleFaceButton" class="mode-button" type="button">3D</button>
            </div>
        </div>

        <div id="multiFacePanel" class="hidden">
            <div id="multiFaceInputs"></div>
        </div>

        <div class="form-actions">
            <button id="saveButton" class="primary-button" type="button">保存</button>
            <button id="resetButton" class="secondary-button" type="button">リセット</button>
        </div>
    </section>

    <!-- =========================
         カード一覧
    ========================== -->
    <section id="listSection" class="section-card hidden">
        <div class="section-heading list-heading">
            <div>
                <p class="eyebrow">CARDS</p>
                <h2>カード一覧</h2>
            </div>
            <button id="searchToggleButton" class="secondary-button" type="button">検索条件</button>
        </div>

        <div id="searchPanel" class="search-panel hidden">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="searchKeyword">キーワード</label>
                    <input id="searchKeyword" type="search" placeholder="名前・読み方・種族・能力など">
                </div>

                <div class="form-group">
                    <label for="searchCostMin">コスト 最小</label>
                    <input id="searchCostMin" type="number" min="0">
                </div>
                <div class="form-group">
                    <label for="searchCostMax">コスト 最大</label>
                    <input id="searchCostMax" type="number" min="0">
                </div>
                <div class="form-group">
                    <label for="searchPowerMin">パワー 最小</label>
                    <input id="searchPowerMin" type="text">
                </div>
                <div class="form-group">
                    <label for="searchPowerMax">パワー 最大</label>
                    <input id="searchPowerMax" type="text">
                </div>
                <div class="form-group full-width">
                    <label for="searchCardType">カードタイプ</label>
                    <input id="searchCardType" type="text" placeholder="クリーチャー / 呪文 など">
                </div>
            </div>

            <div class="search-civilization-area">
                <p class="field-label">文明検索</p>
                <div class="mode-buttons compact">
                    <button id="searchSingleColorButton" class="mode-button" type="button">単色</button>
                    <button id="searchMultiColorButton" class="mode-button" type="button">多色</button>
                    <button id="searchExactMatchButton" class="mode-button" type="button">完全一致</button>
                </div>
                <div id="searchCivilizationButtons" class="civilization-buttons search-civilizations">
                    <button type="button" class="search-civilization-button" data-civilization="光">光</button>
                    <button type="button" class="search-civilization-button" data-civilization="水">水</button>
                    <button type="button" class="search-civilization-button" data-civilization="闇">闇</button>
                    <button type="button" class="search-civilization-button" data-civilization="火">火</button>
                    <button type="button" class="search-civilization-button" data-civilization="自然">自然</button>
                    <button type="button" class="search-civilization-button" data-civilization="無色">無色</button>
                </div>
            </div>

            <label class="check-row">
                <input id="favoritesOnly" type="checkbox">
                <span>お気に入りのみ</span>
            </label>

            <button id="clearSearchButton" class="secondary-button" type="button">条件をクリア</button>
        </div>

        <div id="cardList" class="card-list"></div>
    </section>

    <!-- =========================
         カード詳細
    ========================== -->
    <section id="detailSection" class="section-card hidden">
        <div class="section-heading">
            <div>
                <p class="eyebrow">DETAIL</p>
                <h2>カード詳細</h2>
            </div>
            <button id="backToListButton" class="secondary-button" type="button">一覧へ戻る</button>
        </div>
        <div id="cardDetail" class="card-detail"></div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
